version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: streamvibe-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - streamvibe-network


    # ============= UMAMI ANALYTICS =============
  umami:
    image: umami-custom:local
    container_name: streamvibe-umami-local
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami123@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: my-super-secret-umami-key-local-dev-12345
      DISABLE_TELEMETRY: 1
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/heartbeat || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - streamvibe-network

    # ============= UMAMI DATABASE =============
  umami-db:
    image: postgres:15-alpine
    container_name: streamvibe-umami-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami123
    volumes:
      - umami-db-local-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U umami -d umami" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamvibe-network

