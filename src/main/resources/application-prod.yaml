spring:
  # ===================================
  # DATABASE - SUPABASE (Production)
  # ===================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.xjyzgieluqxlccfdpyvu}
    password: ${SPRING_DATASOURCE_PASSWORD:Zb6umRu9f8EwnsnU}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  # ===================================
  # REDIS
  # ===================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 5000ms
        shutdown-timeout: 200ms
  cache:
    redis:
      time-to-live: 3600000

  # ===================================
  # EMAIL
